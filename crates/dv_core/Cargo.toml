[package]
name = "dv_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "dv's headless domain logic (docs/PLAN.md §4)"

# gpui: never, not even transitively (`script/check` step 3).
[lib]
path = "src/lib.rs"

[dependencies]
ignore.workspace = true
imara-diff.workspace = true
log.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
ulid.workspace = true

# A spawned process's group, and its exit seen before it is reaped (`backend::process`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Children that die with this process, and a spawned process's job (`job`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
dv_test_support.workspace = true
