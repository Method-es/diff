[package]
name = "gpui_automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "JSONL automation for gpui apps and the e2e scenario runner (docs/PLAN.md §14)"

[lib]
path = "src/lib.rs"
doctest = false

# The scenario runner (docs/PLAN.md §14.2, tests/e2e/README.md). It never touches gpui itself; it
# only shares the JSON matcher with the in-app `wait_for`/`assert` commands.
[[bin]]
name = "e2e"
path = "src/bin/e2e/main.rs"

[[example]]
name = "harness"
path = "examples/harness.rs"

[dependencies]
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle.workspace = true
x11rb.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-component.workspace = true
gpui_platform.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
