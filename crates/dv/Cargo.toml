[package]
name = "dv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "dv: local diff and PR review (docs/PLAN.md)"

[[bin]]
name = "dv"
path = "src/main.rs"

[features]
default = ["automation"]
# `--automation`: the JSONL driver used by the e2e scenarios (docs/PLAN.md §14). Shipped builds
# are built with `--no-default-features` and carry none of it (PLAN D9).
# It also seeds fixture repos for scenarios (`seed_repo`, PLAN §14.2) with `dv_test_support`,
# which, like `dv_core`, never depends on gpui.
automation = [
    "dep:dv_test_support",
    "dep:gpui_automation",
    "dep:serde",
    "dep:serde_json",
    "dv_ui/automation",
]

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
# The headless commands (PLAN §10), dispatched before any gpui code runs.
dv_cli.workspace = true
dv_core.workspace = true
dv_test_support = { workspace = true, optional = true }
dv_ui.workspace = true
env_logger.workspace = true
gpui.workspace = true
gpui_automation = { workspace = true, optional = true }
gpui_platform.workspace = true
log.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# The fatal-error message box of the detached app, which has no console (`fatal.rs`), and the
# flags and handle inheritance it is started detached with (`launch.rs`, PLAN §13.1).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["x11"] }

[dev-dependencies]
dv_test_support.workspace = true
gpui = { workspace = true, features = ["test-support"] }
pretty_assertions.workspace = true
serde_json.workspace = true
tempfile.workspace = true
