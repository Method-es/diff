[workspace]
resolver = "3"
members = ["crates/*"]
# The first implementation, kept as read-only reference (CLAUDE.md "legacy/"). Never built.
exclude = ["legacy"]
default-members = ["crates/dv"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# ---- UI stack (docs/PLAN.md D1): gpui-pre snapshot + gpui-component 0.6, the same pins as the sibling app.
# Pinned exactly; bump all of these together.
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6" }
# The tree-sitter grammars `dv_ui::syntax` highlights diffs with (PLAN §6 step 4): every one of
# gpui-component's `tree-sitter-languages` except SQL, whose grammar crate pins `cc` below the
# 1.5 gpui's build already locks.
gpui-component = { version = "=0.6.6", features = [
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cmake",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-ejs",
    "tree-sitter-elixir",
    "tree-sitter-erb",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-svelte",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }

# ---- internal crates (docs/PLAN.md §4)
dv_backend = { path = "crates/dv_backend" }
dv_cli = { path = "crates/dv_cli" }
dv_core = { path = "crates/dv_core" }
dv_lsp = { path = "crates/dv_lsp" }
dv_test_support = { path = "crates/dv_test_support" }
dv_ui = { path = "crates/dv_ui" }
gpui_automation = { path = "crates/gpui_automation" }

# ---- shared third-party
anyhow = "1.0"
# The bytes the backend protocol carries (git output, file contents, store lines), base64 in its
# JSON lines (PLAN §5.1).
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
env_logger = "0.11"
futures = "0.3"
# The globs a language server registers for `workspace/didChangeWatchedFiles` (`dv_lsp`, PLAN
# §18.5); already in the tree through `ignore`.
globset = "0.4"
ignore = "0.4"
imara-diff = "0.2"
# The process group a backend's child process runs in, and its exit read without reaping it
# (`dv_core::backend::process`, PLAN §18.3).
libc = "0.2"
log = "0.4"
# The Language Server Protocol's types (`dv_lsp`, PLAN §18.4); already in the tree through
# gpui-component.
lsp-types = "0.97"
# The Markdown parser gpui-component's `TextView` uses; `dv_ui::markdown` sanitises comment bodies
# with the same AST before they reach it (PLAN §15).
markdown = "1.0.0"
notify = "8.2"
parking_lot = "0.12"
png = "0.18"
pretty_assertions = "1.4"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The build hash of the Linux dv a WSL distro runs (PLAN §5.2).
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
ulid = "3"
windows-sys = "0.61"
x11rb = "0.13"

[profile.dev]
debug = "limited"

# gpui is unusably slow unoptimised; dependencies build at opt-level 2 even in dev, while the
# workspace's own crates stay at 0 for fast incremental builds.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 16
